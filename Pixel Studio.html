document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

U+FFFD;\n}\n<\u002Fstyle>\n<style>html,body{margin:0;background:#111;overscroll-behavior:none;}a{color:#ddd}a:hover{color:#fff}input[type=range]{accent-color:#ffd86e;width:100%;}<\u002Fstyle>\n<\u002Fhelmet>\n<div data-screen-label=\"Pixel Studio\" style=\"height:100vh;display:flex;flex-direction:column;background:#111;color:#ddd;font-family:'Silkscreen',ui-monospace,monospace;font-size:11px;letter-spacing:0.04em;\">\n  <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:16px;padding:10px 16px;border-bottom:2px solid #262626;\">\n    <div style=\"display:flex;align-items:baseline;gap:10px;\">\n      <div style=\"font-size:14px;font-weight:700;color:#f2ecd8;letter-spacing:0.1em;\">PIXEL STUDIO<\u002Fdiv>\n      <div style=\"color:#777;\">320 × 200<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:4px;\">\n      <sc-for list=\"{{ views }}\" as=\"v\" hint-placeholder-count=\"2\">\n        <button sc-camel-on-click=\"{{ v.on }}\" style=\"font:inherit;letter-spacing:0.1em;padding:6px 14px;border:2px solid #333;cursor:pointer;background:{{ v.bg }};color:{{ v.fg }};\">{{ v.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"flex:1;\"><\u002Fdiv>\n    <div style=\"display:flex;gap:4px;align-items:center;\">\n      <button sc-camel-on-click=\"{{ doUndo }}\" title=\"Undo (Ctrl+Z)\" style=\"font:inherit;padding:6px 10px;background:#1c1c1c;border:2px solid #333;color:#ddd;cursor:pointer;opacity:{{ undoOp }};\">UNDO<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ doRedo }}\" title=\"Redo (Ctrl+Shift+Z)\" style=\"font:inherit;padding:6px 10px;background:#1c1c1c;border:2px solid #333;color:#ddd;cursor:pointer;opacity:{{ redoOp }};\">REDO<\u002Fbutton>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:4px;align-items:center;\">\n      <button sc-camel-on-click=\"{{ zoomOut }}\" aria-label=\"Zoom out\" style=\"font:inherit;width:30px;padding:6px 0;background:#1c1c1c;border:2px solid #333;color:#ddd;cursor:pointer;\">−<\u002Fbutton>\n      <div style=\"min-width:44px;text-align:center;color:#bbb;\">{{ zoomLabel }}<\u002Fdiv>\n      <button sc-camel-on-click=\"{{ zoomIn }}\" aria-label=\"Zoom in\" style=\"font:inherit;width:30px;padding:6px 0;background:#1c1c1c;border:2px solid #333;color:#ddd;cursor:pointer;\">+<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ toggleGrid }}\" style=\"font:inherit;padding:6px 10px;border:2px solid #333;cursor:pointer;background:{{ gridBg }};color:{{ gridFg }};\">GRID<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"flex:1;min-height:0;display:grid;grid-template-columns:84px minmax(0,1fr) 270px;\">\n    <div style=\"border-right:2px solid #262626;padding:10px 8px;display:flex;flex-direction:column;gap:6px;\">\n      <sc-for list=\"{{ tools }}\" as=\"t\" hint-placeholder-count=\"4\">\n        <button sc-camel-on-click=\"{{ t.on }}\" title=\"{{ t.hint }}\" style=\"font:inherit;font-size:9px;letter-spacing:0.08em;display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 0 6px;border:2px solid {{ t.bd }};cursor:pointer;background:{{ t.bg }};color:{{ t.fg }};\">\n          <div style=\"width:24px;height:24px;background-image:{{ t.icon }};background-size:100% 100%;image-rendering:pixelated;\"><\u002Fdiv>\n          <div>{{ t.label }}<\u002Fdiv>\n        <\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"min-width:0;min-height:0;display:flex;flex-direction:column;\">\n      <div ref=\"{{ scrollRef }}\" sc-camel-on-drag-over=\"{{ onDragOver }}\" sc-camel-on-drop=\"{{ onDrop }}\" sc-camel-on-pointer-down=\"{{ onDown }}\" sc-camel-on-pointer-move=\"{{ onMove }}\" sc-camel-on-pointer-up=\"{{ onUp }}\" sc-camel-on-pointer-cancel=\"{{ onUp }}\" sc-camel-on-pointer-leave=\"{{ onLeave }}\" sc-camel-on-context-menu=\"{{ noMenu }}\" style=\"flex:1;min-height:0;overflow:auto;display:flex;background:#0c0c0c;touch-action:none;\">\n        <div style=\"margin:auto;padding:24px;\">\n          <div style=\"position:relative;width:{{ cw }};height:{{ ch }};background-color:#262626;background-image:conic-gradient(#303030 25%, #262626 0 50%, #303030 0 75%, #262626 0);background-size:{{ chk }};box-shadow:0 0 0 2px #2c2c2c;\">\n            <canvas ref=\"{{ mainRef }}\" width=\"320\" height=\"200\" style=\"position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;display:block;\"><\u002Fcanvas>\n            <canvas ref=\"{{ ovRef }}\" width=\"{{ ovW }}\" height=\"{{ ovH }}\" style=\"position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;\"><\u002Fcanvas>\n            <canvas ref=\"{{ curRef }}\" width=\"{{ ovW }}\" height=\"{{ ovH }}\" style=\"position:absolute;inset:0;width:100%;height:100%;display:block;cursor:{{ cursorCss }};touch-action:none;\"><\u002Fcanvas>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;gap:18px;padding:7px 16px;border-top:2px solid #262626;color:#888;\">\n        <div>{{ posText }}<\u002Fdiv>\n        <div>{{ gamePosText }}<\u002Fdiv>\n        <div style=\"flex:1;\"><\u002Fdiv>\n        <div style=\"color:{{ statusColor }};\">{{ statusText }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border-left:2px solid #262626;overflow:auto;display:flex;flex-direction:column;\">\n      <sc-if value=\"{{ isPaint }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"border-bottom:2px solid #262626;display:flex;flex-direction:column;\">\n        <button sc-camel-on-click=\"{{ sec.color.toggle }}\" style=\"font:inherit;display:flex;align-items:flex-start;gap:10px;width:100%;padding:11px 14px;background:{{ sec.color.bg }};border:0;cursor:pointer;text-align:left;color:#ddd;\" style-hover=\"background:#181818;\"><div style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;\"><div style=\"color:#f2ecd8;letter-spacing:0.14em;font-size:10px;\">COLOR &amp; BRUSH<\u002Fdiv><div style=\"color:#6a6a6a;font-size:8px;letter-spacing:0.06em;line-height:1.5;\">WHAT THE PENCIL PAINTS · ALT+CLICK CANVAS TO PICK A COLOR<\u002Fdiv><\u002Fdiv><div style=\"color:#888;font-size:10px;padding-top:1px;\">{{ sec.color.caret }}<\u002Fdiv><\u002Fbutton>\n        <sc-if value=\"{{ sec.color.open }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"padding:2px 14px 16px;display:flex;flex-direction:column;gap:10px;\">\n          <div style=\"display:flex;gap:10px;align-items:center;\">\n            <label style=\"position:relative;width:44px;height:44px;flex-shrink:0;background:{{ color }};box-shadow:0 0 0 2px #444;cursor:pointer;\">\n              <input type=\"color\" value=\"{{ color }}\" sc-camel-on-change=\"{{ onColor }}\" style=\"position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;\">\n            <\u002Flabel>\n            <div style=\"display:flex;flex-direction:column;gap:3px;\">\n              <div style=\"color:#f2ecd8;font-size:13px;\">{{ colorHex }}<\u002Fdiv>\n              <div style=\"color:#777;font-size:9px;\">CLICK SWATCH TO EDIT · ALT+CLICK CANVAS TO PICK<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <sc-if value=\"{{ hasRecent }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"color:#666;font-size:9px;letter-spacing:0.12em;\">RECENT<\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(8, minmax(0,1fr));gap:4px;\">\n              <sc-for list=\"{{ recent }}\" as=\"s\" hint-placeholder-count=\"4\">\n                <button sc-camel-on-click=\"{{ s.on }}\" title=\"{{ s.c }}\" style=\"aspect-ratio:1;border:0;padding:0;cursor:pointer;background:{{ s.c }};box-shadow:{{ s.ring }};\"><\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <div style=\"color:#666;font-size:9px;letter-spacing:0.12em;\">IN THE SCENE<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(8, minmax(0,1fr));gap:4px;\">\n            <sc-for list=\"{{ palette }}\" as=\"s\" hint-placeholder-count=\"16\">\n              <button sc-camel-on-click=\"{{ s.on }}\" title=\"{{ s.c }}\" style=\"aspect-ratio:1;border:0;padding:0;cursor:pointer;background:{{ s.c }};box-shadow:{{ s.ring }};\"><\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:6px;border-top:2px solid #1e1e1e;padding-top:10px;\">\n            <div style=\"display:flex;justify-content:space-between;color:#777;font-size:9px;letter-spacing:0.1em;\"><div>BRUSH SIZE<\u002Fdiv><div style=\"color:#f2ecd8;\">{{ sizeLabel }}<\u002Fdiv><\u002Fdiv>\n            <input type=\"range\" min=\"1\" max=\"8\" step=\"1\" value=\"{{ size }}\" sc-camel-on-change=\"{{ onSize }}\">\n            <div style=\"color:#666;font-size:8px;letter-spacing:0.06em;\">[ AND ] TO RESIZE · PENCIL + ERASER<\u002Fdiv>\n          <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ isClip }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"border-bottom:2px solid #262626;display:flex;flex-direction:column;\">\n        <button sc-camel-on-click=\"{{ sec.clip.toggle }}\" style=\"font:inherit;display:flex;align-items:flex-start;gap:10px;width:100%;padding:11px 14px;background:{{ sec.clip.bg }};border:0;cursor:pointer;text-align:left;color:#ddd;\" style-hover=\"background:#181818;\"><div style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;\"><div style=\"color:#f2ecd8;letter-spacing:0.14em;font-size:10px;\">SELECTION<\u002Fdiv><div style=\"color:#6a6a6a;font-size:8px;letter-spacing:0.06em;line-height:1.5;\">PAINT OVER PIXELS, THEN CLIP OR COPY THEM TO A NEW LAYER<\u002Fdiv><\u002Fdiv><div style=\"color:#888;font-size:10px;padding-top:1px;\">{{ sec.clip.caret }}<\u002Fdiv><\u002Fbutton>\n        <sc-if value=\"{{ sec.clip.open }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"padding:2px 14px 16px;display:flex;flex-direction:column;gap:10px;\">\n          <div style=\"display:flex;flex-direction:column;gap:8px;\">\n            <div style=\"display:flex;justify-content:space-between;color:#888;letter-spacing:0.14em;font-size:10px;\"><div>SELECTION BRUSH<\u002Fdiv><div style=\"color:#f2ecd8;\">{{ selSizeLabel }}<\u002Fdiv><\u002Fdiv>\n            <input type=\"range\" min=\"1\" max=\"24\" step=\"1\" value=\"{{ selSize }}\" sc-camel-on-change=\"{{ onSelSize }}\">\n            <div style=\"color:#666;font-size:9px;line-height:1.5;\">PAINT OVER PIXELS ON THE ACTIVE LAYER, THEN CLIP THEM INTO THEIR OWN LAYER.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:6px;\">\n            <div style=\"display:flex;justify-content:space-between;color:#888;letter-spacing:0.14em;font-size:10px;\"><div>SELECTION<\u002Fdiv><div style=\"color:#ffd86e;\">{{ selCountLabel }}<\u002Fdiv><\u002Fdiv>\n            <button sc-camel-on-click=\"{{ clipToLayer }}\" style=\"font:inherit;letter-spacing:0.08em;padding:9px;background:#ffd86e;color:#1a1410;border:0;cursor:pointer;font-weight:700;opacity:{{ selOp }};\">CLIP TO NEW LAYER<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ copyToLayer }}\" style=\"font:inherit;letter-spacing:0.08em;padding:8px;background:#1c1c1c;color:#ddd;border:2px solid #333;cursor:pointer;opacity:{{ selOp }};\">COPY TO NEW LAYER<\u002Fbutton>\n            <div style=\"display:grid;grid-template-columns:repeat(3, minmax(0,1fr));gap:4px;\">\n              <button sc-camel-on-click=\"{{ selLayer }}\" title=\"Select every pixel on the active layer\" style=\"font:inherit;font-size:9px;padding:7px 0;background:#1c1c1c;color:#ddd;border:2px solid #333;cursor:pointer;\">LAYER<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ selInvert }}\" style=\"font:inherit;font-size:9px;padding:7px 0;background:#1c1c1c;color:#ddd;border:2px solid #333;cursor:pointer;\">INVERT<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ selClear }}\" style=\"font:inherit;font-size:9px;padding:7px 0;background:#1c1c1c;color:#ddd;border:2px solid #333;cursor:pointer;\">CLEAR<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n      <div style=\"border-bottom:2px solid #262626;display:flex;flex-direction:column;\">\n        <button sc-camel-on-click=\"{{ sec.layers.toggle }}\" style=\"font:inherit;display:flex;align-items:flex-start;gap:10px;width:100%;padding:11px 14px;background:{{ sec.layers.bg }};border:0;cursor:pointer;text-align:left;color:#ddd;\" style-hover=\"background:#181818;\"><div style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;\"><div style=\"color:#f2ecd8;letter-spacing:0.14em;font-size:10px;\">LAYERS<\u002Fdiv><div style=\"color:#6a6a6a;font-size:8px;letter-spacing:0.06em;line-height:1.5;\">ORDER, VISIBILITY AND OPACITY OF EACH LAYER<\u002Fdiv><\u002Fdiv><div style=\"color:#888;font-size:10px;padding-top:1px;\">{{ sec.layers.caret }}<\u002Fdiv><\u002Fbutton>\n        <sc-if value=\"{{ sec.layers.open }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"padding:2px 14px 16px;display:flex;flex-direction:column;gap:10px;\">\n          <button sc-camel-on-click=\"{{ newLayer }}\" style=\"font:inherit;font-size:10px;padding:6px;background:#1c1c1c;color:#ddd;border:2px solid #333;cursor:pointer;\">+ NEW LAYER<\u002Fbutton>\n        <div style=\"display:flex;flex-direction:column;gap:3px;\">\n          <sc-for list=\"{{ layerRows }}\" as=\"l\" hint-placeholder-count=\"5\">\n            <div sc-camel-on-click=\"{{ l.select }}\" sc-camel-on-double-click=\"{{ l.rename }}\" title=\"Double-click to rename\" style=\"display:flex;align-items:center;gap:8px;padding:4px 6px;cursor:pointer;background:{{ l.bg }};box-shadow:{{ l.ring }};\">\n              <button sc-camel-on-click=\"{{ l.toggle }}\" aria-label=\"Toggle visibility\" style=\"font:inherit;font-size:9px;width:30px;padding:3px 0;background:none;border:2px solid #3a3a3a;cursor:pointer;color:{{ l.eyeFg }};\">{{ l.eye }}<\u002Fbutton>\n              <div style=\"width:48px;height:30px;flex-shrink:0;background-color:#262626;background-image:{{ l.thumb }};background-size:100% 100%;image-rendering:pixelated;opacity:{{ l.op }};\"><\u002Fdiv>\n              <div style=\"flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:{{ l.fg }};\">{{ l.name }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:6px;padding-top:4px;\">\n          <div style=\"display:flex;justify-content:space-between;color:#777;font-size:9px;letter-spacing:0.1em;\"><div>LAYER OPACITY<\u002Fdiv><div style=\"color:#f2ecd8;\">{{ layerOpacityLabel }}<\u002Fdiv><\u002Fdiv>\n          <input type=\"range\" min=\"0\" max=\"100\" step=\"1\" value=\"{{ layerOpacity }}\" sc-camel-on-pointer-down=\"{{ opStart }}\" sc-camel-on-change=\"{{ onLayerOpacity }}\">\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(4, minmax(0,1fr));gap:4px;\">\n          <button sc-camel-on-click=\"{{ layerUp }}\" style=\"font:inherit;font-size:9px;padding:6px 0;background:#1c1c1c;color:#ddd;border:2px solid #333;cursor:pointer;\">UP<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ layerDown }}\" style=\"font:inherit;font-size:9px;padding:6px 0;background:#1c1c1c;color:#ddd;border:2px solid #333;cursor:pointer;\">DOWN<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ mergeDown }}\" title=\"Merge into layer below\" style=\"font:inherit;font-size:9px;padding:6px 0;background:#1c1c1c;color:#ddd;border:2px solid #333;cursor:pointer;\">MERGE<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ delLayer }}\" style=\"font:inherit;font-size:9px;padding:6px 0;background:#1c1c1c;color:#e89a8a;border:2px solid #333;cursor:pointer;\">DEL<\u002Fbutton>\n        <\u002Fdiv>\n          <div style=\"color:#555;font-size:8px;letter-spacing:0.06em;\">DOUBLE-CLICK A LAYER TO RENAME<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <sc-if value=\"{{ isPaint }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"border-bottom:2px solid #262626;display:flex;flex-direction:column;\">\n        <button sc-camel-on-click=\"{{ sec.import.toggle }}\" style=\"font:inherit;display:flex;align-items:flex-start;gap:10px;width:100%;padding:11px 14px;background:{{ sec.import.bg }};border:0;cursor:pointer;text-align:left;color:#ddd;\" style-hover=\"background:#181818;\"><div style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;\"><div style=\"color:#f2ecd8;letter-spacing:0.14em;font-size:10px;\">IMPORT<\u002Fdiv><div style=\"color:#6a6a6a;font-size:8px;letter-spacing:0.06em;line-height:1.5;\">BRING AN IMAGE IN AS A NEW LAYER — PIXELATED OR EXACT<\u002Fdiv><\u002Fdiv><div style=\"color:#888;font-size:10px;padding-top:1px;\">{{ sec.import.caret }}<\u002Fdiv><\u002Fbutton>\n        <sc-if value=\"{{ sec.import.open }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"padding:2px 14px 16px;display:flex;flex-direction:column;gap:10px;\">\n          <input ref=\"{{ fileRef }}\" type=\"file\" accept=\"image/png,image/jpeg,image/gif,image/webp,image/bmp,.png,.jpg,.jpeg,.gif,.webp,.bmp\" sc-camel-on-change=\"{{ onFile }}\" style=\"display:none;\">\n          <input ref=\"{{ pngRef }}\" type=\"file\" accept=\"image/png,.png\" sc-camel-on-change=\"{{ onPng }}\" style=\"display:none;\">\n          <button sc-camel-on-click=\"{{ pickFile }}\" style=\"font:inherit;letter-spacing:0.08em;padding:9px;background:#f2ecd8;color:#1a1410;border:0;cursor:pointer;font-weight:700;\">IMPORT &amp; PIXELATE…<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ pickPng }}\" title=\"Places the PNG pixel-for-pixel: no resizing, no palette change, transparency kept\" style=\"font:inherit;letter-spacing:0.08em;padding:9px;background:#ffd86e;color:#
